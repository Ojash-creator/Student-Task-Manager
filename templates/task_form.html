{% extends "base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<form class="panel form" method="post">
  <label>Title *<input type="text" name="title" maxlength="100" required value="{{ task.title }}"></label>
  <label>Description<textarea name="description" rows="3">{{ task.description or '' }}</textarea></label>
  <label>Student (name / roll no.)<input type="text" name="student" value="{{ task.student or '' }}"></label>
  <label>Subject / Category<input type="text" name="subject" value="{{ task.subject or '' }}"></label>
  <label>Due Date *<input type="date" name="due_date" required value="{{ task.due_date }}"></label>
  <label>Priority<select name="priority">
    {% for p in priorities %}<option {{ 'selected' if task.priority == p }}>{{ p }}</option>{% endfor %}</select></label>
  <label>Status<select name="status">
    {% for s in statuses %}<option {{ 'selected' if task.status == s }}>{{ s }}</option>{% endfor %}</select></label>
  <div><button class="btn">Save Task</button> <a class="btn alt" href="{{ url_for('tasks') }}">Cancel</a></div>
</form>
{% endblock %}
