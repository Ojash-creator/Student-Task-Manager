{% extends "base.html" %}
{% from "_macros.html" import task_table %}
{% block content %}
<div class="head"><h1>All Tasks</h1><a class="btn" href="{{ url_for('add_task') }}">+ Add Task</a></div>
<form class="filters" method="get">
  <input type="text" name="q" placeholder="Search by title..." value="{{ f.q }}">
  <select name="student"><option value="">All Students</option>
    {% for s in students %}<option {{ 'selected' if f.student == s }}>{{ s }}</option>{% endfor %}</select>
  <select name="status"><option value="">All Statuses</option>
    {% for s in statuses %}<option {{ 'selected' if f.status == s }}>{{ s }}</option>{% endfor %}</select>
  <select name="priority"><option value="">All Priorities</option>
    {% for p in priorities %}<option {{ 'selected' if f.priority == p }}>{{ p }}</option>{% endfor %}</select>
  <select name="subject"><option value="">All Subjects</option>
    {% for s in subjects %}<option {{ 'selected' if f.subject == s }}>{{ s }}</option>{% endfor %}</select>
  <button class="btn">Filter</button>
  <a class="btn alt" href="{{ url_for('tasks') }}">Reset</a>
</form>
<div class="panel">{{ task_table(tasks) }}</div>
{% endblock %}
